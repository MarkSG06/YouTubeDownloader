<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>YouTube Downloader</title>
</head>

<body>
    <section class="content">
        <div class="card">
            <div class="badge">YouTube Downloader V.1</div>

            <h1>Descarga videos y playlists</h1>
            <p>Pega una URL de YouTube, y guarda el contenido en tu equipo.</p>

            <form class="download-form">
                <div class="input-group">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2A31.2 31.2 0 0 0 0 12a31.2 31.2 0 0 0 .5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.2 31.2 0 0 0 24 12a31.2 31.2 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12l-6.2 3.6Z" />
                    </svg>

                    <input type="text" placeholder="https://youtube.com/watch?..." />
                </div>
                <button class="download-btn" type="submit">
                    Descargar
                </button>
            </form>
        </div>
    </section>

    <nav class="menu">
        <ul>
            <li>
                <a href="#" class="active">
                    <div class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                d="M3.75 13.95v8.25h6v-6a1.5 1.5 0 0 1 1.5-1.5h1.5a1.5 1.5 0 0 1 1.5 1.5v6h6v-8.25m-19.5-1.5L10.95 2.25a1.5 1.5 0 0 1 2.1 0l10.2 10.2" />
                        </svg>
                    </div>
                    <span>Home</span>
                </a>
            </li>

            <li>
                <a href="#">
                    <div class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                d="m10 8l6 4l-6 4V8Z" />
                            <rect width="20" height="14" x="2" y="5" fill="none" stroke="currentColor" rx="3" />
                        </svg>
                    </div>
                    <span>Video</span>
                </a>
            </li>

            <li>
                <a href="#">
                    <div class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                d="M4 6h10M4 10h10M4 14h7m7-2l3 2l-3 2v-4Z" />
                        </svg>
                    </div>
                    <span>Playlist</span>
                </a>
            </li>

            <li>
                <a href="#">
                    <div class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                d="M4 7h16M4 12h16M4 17h10" />
                        </svg>
                    </div>
                    <span>Files</span>
                </a>
            </li>

            <li>
                <a href="#">
                    <div class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Zm7.4-3.5a7.4 7.4 0 0 0-.1-1.2l2-1.5l-2-3.4l-2.4 1a8 8 0 0 0-2-1.1L14.5 3h-5l-.4 2.8a8 8 0 0 0-2 1.1l-2.4-1l-2 3.4l2 1.5a7.4 7.4 0 0 0 0 2.4l-2 1.5l2 3.4l2.4-1a8 8 0 0 0 2 1.1l.4 2.8h5l.4-2.8a8 8 0 0 0 2-1.1l2.4 1l2-3.4l-2-1.5c.1-.4.1-.8.1-1.2Z" />
                        </svg>
                    </div>
                    <span>Settings</span>
                </a>
            </li>
        </ul>
    </nav>
    <script src="app.js"></script>

</body>

</html>
